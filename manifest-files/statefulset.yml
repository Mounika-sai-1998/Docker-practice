---
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: my-statefulset
  namespace: default      
spec: 
  serviceName: mysqldb
  replicas: 1
  selector:
    matchLabels:
      app: app-db
  template:
    metadata:
      labels:
        app: app-db
    spec:
      containers:
        - name: container-db
          image: mounikaaarepu/phpapp:dbimage
          ports:
            - containerPort: 3306

          # secret references
          envFrom:
            - secretRef:
                name: my-secret

          # resource quota references
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          # persistent volume claim references
          volumeMounts:
          - name: my-pvc
            mountPath: /var/lib/mysql 


      # persistent volume claim templates
      volumeClaimTemplates:
      - metadata:
          name: my-pvc
        spec:
          accessModes: 
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi 